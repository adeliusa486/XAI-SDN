name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Code Quality ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}

      - name: Install linting tools
        run: pip install black isort flake8

      - name: Check formatting (black)
        run: black --check features model explainability api tests scripts --line-length=100

      - name: Check imports (isort)
        run: isort --check features model explainability api tests scripts --profile=black

      - name: Lint (flake8)
        run: flake8 features model explainability api --max-line-length=100 --ignore=E501,W503,E203

  # ─── Unit Tests ───────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p data model/artifacts logs

      - name: Run unit tests (entropy + model + pipeline)
        run: |
          pytest tests/test_entropy.py tests/test_model.py tests/test_pipeline.py \
            -v --tb=short --asyncio-mode=auto

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --tb=short --asyncio-mode=auto

      - name: Run with coverage
        if: matrix.python-version == '3.10'
        run: |
          pip install pytest-cov
          pytest tests/ --cov=features --cov=model --cov=explainability --cov=api \
            --cov-report=xml --cov-report=term-missing --asyncio-mode=auto
        continue-on-error: true

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─── Smoke Test ───────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data model/artifacts logs

      - name: Run smoke test (no API)
        run: python scripts/smoke_test.py --skip-api

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: SMOKE_TEST_REPORT.md

  # ─── Model Training Validation ────────────────────────────────────────────
  train-validate:
    name: Training Validation
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data/synthetic model/artifacts logs

      - name: Train model on synthetic data
        run: |
          # NOTE: --n-estimators 50 is for CI speed only.
          # Production training uses n_estimators=200 (configs/model_config.yaml).
          # The 50-tree model is NOT the model whose metrics are reported in README.
          python model/train.py --use-synthetic --n-estimators 50

      - name: Evaluate model
        run: python model/evaluate.py --use-synthetic

      - name: Run ablation study (fast)
        run: python model/ablation.py --use-synthetic

      - name: Check metrics meet threshold
        run: |
          python -c "
          import json
          with open('model/artifacts/metrics.json') as f:
              m = json.load(f)
          acc = m['accuracy']
          f1 = m['macro_f1']
          print(f'Accuracy: {acc:.4f}, Macro F1: {f1:.4f}')
          assert acc > 0.95, f'Accuracy {acc:.4f} < 0.95 — training regression!'
          assert f1 > 0.95, f'Macro F1 {f1:.4f} < 0.95 — training regression!'
          print('✅ Metrics pass threshold.')
          "

      - name: Verify reproducibility manifest
        run: |
          python -c "
          import json
          with open('model/artifacts/reproducibility_manifest.json') as f:
              m = json.load(f)
          assert m['data_source'] == 'synthetic'
          assert 'accuracy' in m['metrics']
          assert m['metrics']['n_features'] == 88
          print('✅ Reproducibility manifest verified.')
          "

      - name: Run multi-seed validation
        run: bash scripts/run_multiseed.sh --synthetic --seeds "42 123"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: model/artifacts/
          retention-days: 14

  # ─── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          tags: xai-sdn:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
