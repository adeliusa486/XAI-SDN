apiVersion: v1
kind: Namespace
metadata:
  name: xaisdn
---
apiVersion: v1
kind: Service
metadata:
  name: xaisdn-api-svc
  namespace: xaisdn
spec:
  selector:
    app: xaisdn-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: xaisdn-dashboard-svc
  namespace: xaisdn
spec:
  selector:
    app: xaisdn-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-artifacts-pvc
  namespace: xaisdn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-db-pvc
  namespace: xaisdn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: xaisdn-secrets
  namespace: xaisdn
type: Opaque
stringData:
  database-url: "sqlite+aiosqlite:///data/alerts.db"
