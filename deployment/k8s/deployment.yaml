apiVersion: apps/v1
kind: Deployment
metadata:
  name: xaisdn-api
  namespace: xaisdn
  labels:
    app: xaisdn-api
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xaisdn-api
  template:
    metadata:
      labels:
        app: xaisdn-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: xai-sdn:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: xaisdn-secrets
                  key: database-url
            - name: MODEL_ARTIFACTS_DIR
              value: /app/model/artifacts
            - name: DETECTION_THRESHOLD
              value: "0.70"
            - name: LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: model-artifacts
              mountPath: /app/model/artifacts
              readOnly: true
            - name: alert-db
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: model-artifacts-pvc
        - name: alert-db
          persistentVolumeClaim:
            claimName: alert-db-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xaisdn-dashboard
  namespace: xaisdn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xaisdn-dashboard
  template:
    metadata:
      labels:
        app: xaisdn-dashboard
    spec:
      containers:
        - name: dashboard
          image: xai-sdn:latest
          command: ["streamlit", "run", "dashboard/app.py",
                    "--server.address", "0.0.0.0",
                    "--server.port", "8501",
                    "--server.headless", "true"]
          ports:
            - containerPort: 8501
          env:
            - name: DASHBOARD_API_URL
              value: http://xaisdn-api-svc:8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
