# Model Training Configuration
# Used by model/train.py and model/hyperparameter_search.py

training:
  experiment_name: "xai-sdn-rf-v1"
  mlflow_tracking_uri: "mlruns"
  save_artifacts: true
  artifacts_dir: "model/artifacts"

random_forest:
  n_estimators: 200
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: "sqrt"
  bootstrap: true
  class_weight: "balanced"
  n_jobs: -1
  random_state: 42

cross_validation:
  n_splits: 5
  scoring: "f1_macro"
  shuffle: true

hyperparameter_grid:
  n_estimators: [100, 200, 300]
  max_features: ["sqrt", "log2", 0.3]
  min_samples_leaf: [1, 2, 4]

data:
  test_size: 0.30
  random_state: 42
  stratify: true
  scale_features: true              # StandardScaler

evaluation:
  metrics:
    - accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - roc_auc_ovr
  compute_confusion_matrix: true
  compute_per_class_metrics: true
  compute_latency: true
  latency_runs: 3                   # Average over N runs for stable latency

ablation:
  configurations:
    - name: "RF-CIC-only"
      features: "cic_only"          # 80 features
      model: "random_forest"
    - name: "RF-Entropy-only"
      features: "entropy_only"      # 8 features
      model: "random_forest"
    - name: "SVM-Full"
      features: "full"              # 88 features
      model: "svm"
    - name: "XAI-SDN-Full"
      features: "full"              # 88 features
      model: "random_forest"
