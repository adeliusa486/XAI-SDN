[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "xai-sdn"
version = "0.1.0"
description = "Explainable Entropy-Guided ML for Real-Time DDoS Detection in SDNs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
keywords = ["ddos", "sdn", "explainability", "shap", "network-security", "entropy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/adeliusa486/XAI-SDN"
Documentation = "https://github.com/adeliusa486/XAI-SDN/tree/main/docs"
Issues = "https://github.com/adeliusa486/XAI-SDN/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]
deep = [
    "torch>=2.1.0",
]
sdn = [
    # Ryu requires Python <=3.8; install in separate venv
    # See docs/deployment_guide.md
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["features", "model", "explainability", "api"]
omit = ["*/tests/*", "*/scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
